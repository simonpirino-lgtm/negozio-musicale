<div class="container mt-4">

    <h2 class="text-center mb-4">Gestione Album</h2>

    <div class="card p-4 mb-4 shadow">
        <h4>Inserisci Nuovo Album</h4>

        <input [(ngModel)]="newAlbum.title" class="form-control mb-2" placeholder="Titolo Album">

        <input [(ngModel)]="newAlbum.year_release" class="form-control mb-2" placeholder="Anno Uscita">

        <input [(ngModel)]="newAlbum.price" class="form-control mb-2" placeholder="Prezzo">

        <select [(ngModel)]="newAlbum.artist_id" class="form-select mb-3">
            <option value="">Seleziona Artista</option>
            <option *ngFor="let a of artists" [value]="a.id">
                {{a.name}} - {{a.genre}}
            </option>
        </select>

        <button class="btn btn-success" (click)="saveAlbum()">Salva Album</button>
    </div>

    <table class="table table-striped table-bordered shadow text-center">
        <thead class="table-dark">
            <tr>
                <th>Titolo</th>
                <th>Anno</th>
                <th>Prezzo</th>
                <th>Artista Associato</th>
                <th>Azione</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let a of albums">
                <td>{{a.title}}</td>
                <td>{{a.year_release}}</td>
                <td>{{a.price}} €</td>
                <td>{{a.artist_name}}</td>
                <td>
                    <button class="btn btn-danger btn-sm" (click)="removeAlbum(a.id)">
                        Elimina
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="text-center mt-3">
        <a routerLink="/" class="btn btn-secondary">Home</a>
    </div>

</div>
