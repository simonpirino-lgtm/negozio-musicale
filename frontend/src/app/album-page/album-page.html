<div class="page">

  <div class="card">

    <h2>Gestione Album</h2>

    <div class="album-layout">

      <!-- ELENCO ALBUM A SINISTRA -->
      <div class="album-list">

        <h3>Album presenti</h3>

        <table>

          <tr>
            <th>Titolo</th>
            <th>Anno</th>
            <th>Prezzo</th>
            <th>Artista Associato</th>
            <th>Azione</th>
          </tr>

          <tr *ngFor="let a of albums">

            <td>{{a.title}}</td>

            <td>{{a.year_release}}</td>

            <td>{{a.price}} €</td>

            <td>{{a.artist_name}}</td>

            <td>
              <button (click)="removeAlbum(a.id)">
                Elimina
              </button>
            </td>

          </tr>

        </table>

      </div>


      <!-- INSERIMENTO ALBUM A DESTRA -->
      <div class="album-create">

        <h3>Inserisci Nuovo Album</h3>

        <div class="form">

          <input
            [(ngModel)]="newAlbum.title"
            placeholder="Titolo Album">

          <input
            [(ngModel)]="newAlbum.year_release"
            placeholder="Anno Uscita">

          <input
            [(ngModel)]="newAlbum.price"
            placeholder="Prezzo">

          <select [(ngModel)]="newAlbum.artist_id">

            <option value="">
              Seleziona Artista
            </option>

            <option
              *ngFor="let a of artists"
              [value]="a.id">

              {{a.name}} - {{a.genre}}

            </option>

          </select>

          <button (click)="saveAlbum()">
            Salva Album
          </button>

        </div>

      </div>

    </div>


    <!-- NAVIGAZIONE -->
    <div class="nav">

      <a routerLink="/">
        Home
      </a>

      <a routerLink="/artists">
        Artisti
      </a>

    </div>

  </div>

</div>
