<div class="page">

  <div class="card">

    <h2>Lista Artisti</h2>

    <table>

      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Genere</th>
        <th>Paese</th>
      </tr>

      <tr *ngFor="let t of artists">
        <td>{{t.id}}</td>
        <td>{{t.name}}</td>
        <td>{{t.genre}}</td>
        <td>{{t.country}}</td>
      </tr>

    </table>

    <div class="nav">

      <a routerLink="/">
        Home
      </a>

      <a routerLink="/albums">
        Album
      </a>

    </div>

  </div>

</div>
